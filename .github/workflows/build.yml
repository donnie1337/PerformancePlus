name: Build PerformancePlus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar PerformancePlus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Compilar com Maven
        run: mvn -B package --no-transfer-progress

      - name: Verificar JAR
        run: |
          test -f target/PerformancePlus.jar
          ls -lh target/PerformancePlus.jar

      - name: Publicar PerformancePlus.jar
        uses: actions/upload-artifact@v4
        with:
          name: PerformancePlus
          path: target/PerformancePlus.jar
          if-no-files-found: error
          retention-days: 14
