name: PerformancePlus
version: '1.0.0'
main: com.performanceplus.PerformancePlus
api-version: '1.21'
author: SeuNome
description: Plugin de controle e otimização de performance para servidores Spigot/Bukkit.

commands:
  performanceplus:
    description: Comando principal do PerformancePlus
    aliases: [pperf, pp]
    usage: /<command> [status|chunk|farms|recount|reload|help]
  limites:
    description: Mostra os limites ativos do servidor
    usage: /limites

permissions:
  performanceplus.admin:
    description: Acesso total aos comandos administrativos (reload, recount)
    default: op
  performanceplus.notify:
    description: Recebe alertas de performance (TPS/MSPT baixos, geração de chunks)
    default: op
  performanceplus.notify.farms:
    description: Recebe alertas de chunks sinalizados como possíveis farms
    default: op
  performanceplus.bypass.spawners:
    description: Ignora o limite de spawners por chunk
    default: op
  performanceplus.bypass.hoppers:
    description: Ignora o limite de hoppers por chunk
    default: op
  performanceplus.bypass.pistons:
    description: Ignora o limite de pistões por chunk
    default: op
  performanceplus.bypass.observers:
    description: Ignora o limite de observers por chunk
    default: op
