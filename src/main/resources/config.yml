# =========================================================
#  PerformancePlus - Configuração
# =========================================================
#
#  Todas as chaves em "limits" valem para todos os mundos por padrão.
#  Para sobrescrever um valor em um mundo específico, use a seção
#  "worlds" no final deste arquivo.

settings:
  # Intervalo mínimo entre varreduras completas dos chunks carregados.
  # 20 ticks = 1 segundo.
  check-interval-ticks: 100

  # Quantos chunks podem ser analisados por tick durante a varredura.
  # O processamento distribuído evita uma grande travada quando há muitos
  # chunks carregados. Aumente somente se o servidor tiver folga de CPU.
  scan-chunks-per-tick: 25

  ignored-worlds: []

  language-prefix: "&8[&b&lPerformance&f&lPlus&8] &7"

  auto-cleanup:
    enabled: false

limits:
  mobs-per-chunk: 60
  spawners-per-chunk: 4
  entities-per-chunk: 100
  items-per-chunk: 40
  xp-orbs-per-chunk: 30
  hoppers-per-chunk: 8

  # Atualizações de redstone permitidas por chunk dentro de cada janela
  # aproximada de um tick (50 ms).
  redstone-updates-per-chunk-per-tick: 25

  pistons-per-chunk: 12
  piston-activations-per-second: 8
  observers-per-chunk: 12

  # Apenas alerta/monitoramento: o Bukkit não permite cancelar a geração
  # depois que o ChunkLoadEvent de um chunk novo acontece.
  max-chunks-generated-per-second: 10

farm-control:
  enabled: true
  activity-threshold: 50
  notify-staff: true

monitoring:
  enabled: true
  tps-warning-threshold: 18.0
  mspt-warning-threshold: 50.0
  broadcast-to-ops: true

worlds:
  world_nether:
    limits:
      mobs-per-chunk: 40
      pistons-per-chunk: 8
  # Exemplo:
  # farm_world:
  #   limits:
  #     hoppers-per-chunk: 20
  #     redstone-updates-per-chunk-per-tick: 60
