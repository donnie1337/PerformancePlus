# ============================================================
# PerformancePlus - proteção global de performance
# ============================================================
# O código executa as regras abaixo; os valores e ações ficam aqui.
# Limites <= 0 desativam o respectivo limite.

configuracao:
  prefixo: "&8[&b&lPerformance&f&lPlus&8] &7"
  debug: false

mundos:
  ignorados: []

limites:
  # Criaturas são limitadas por proximidade, não por chunk.
  # O mesmo limite é aplicado a animais, monstros, aldeões, golems e chefes.
  mobs:
    habilitado: true
    valor: 8
    raio: 16
    # Configure apenas as criaturas que precisarem de um valor diferente.
    # Exemplo:
    # criaturas:
    #   cow:
    #     valor: 12
    #     raio: 20

  entidades:
    habilitado: true
    valor: 20

  hoppers:
    habilitado: true
    valor: 20

  spawners:
    habilitado: true
    valor: 2

  pistoes:
    habilitado: true
    valor: 10

  pistoes-ativacoes-por-segundo:
    habilitado: true
    valor: 8

  observers:
    habilitado: true
    valor: 10

  redstone:
    habilitado: true
    valor: 25
    # bloquear-atualizacao = corta a atualização que exceder o limite.
    # monitorar = apenas registra a carga, sem alterar o redstone.
    acao-quando-exceder: "bloquear-atualizacao"

  # Componentes de Redstone
  suporte-armaduras:
    habilitado: true
    valor: 10
  carrinho-com-bau:
    habilitado: true
    valor: 4
  comparadores:
    habilitado: true
    valor: 28
  ejetores:
    habilitado: true
    valor: 14
  liberadores:
    habilitado: true
    valor: 14
  carrinho-com-fornalha:
    habilitado: true
    valor: 4
  carrinho-com-funil:
    habilitado: true
    valor: 4
  carrinho-de-mina:
    habilitado: true
    valor: 4
  blocos-de-redstone:
    habilitado: true
    valor: 20
  lampadas-de-redstone:
    habilitado: true
    valor: 36
  tochas-de-redstone:
    habilitado: true
    valor: 32
  po-de-redstone:
    habilitado: true
    valor: 32
  repetidores:
    habilitado: true
    valor: 28
  sensores-de-sculk:
    habilitado: true
    valor: 12
  catalisadores-de-sculk:
    habilitado: true
    valor: 12
  emissores-de-sculk:
    habilitado: true
    valor: 12
  sinalizadores:
    habilitado: true
    valor: 3
  pistoes-com-slime:
    habilitado: true
    valor: 20
  carrinho-com-dinamite:
    habilitado: true
    valor: 4

  chunks-gerados-por-segundo:
    habilitado: false
    valor: 20

  # Pontuação de concentração usada apenas para identificar áreas muito pesadas.
  farm-pontuacao:
    habilitado: true
    valor: 100

farm:
  habilitado: true
  notificar-staff: true


